[package]
name = "pace-pkg"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
reqwest = { version = "0.13", features = ["json"] }
flate2 = "1.0"
tar = "0.4.41"
dirs = "7.0.0"
semver = "1.0.28"
toml_edit = "0.22.27"
tokio = { version = "1.37.0", features = ["rt-multi-thread", "macros"] }
