name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: pace
            os_name: linux
            arch_name: x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: pace
            os_name: linux
            arch_name: aarch64
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: pace
            os_name: macos
            arch_name: x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: pace
            os_name: macos
            arch_name: aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: pace.exe
            os_name: windows
            arch_name: x86_64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: pace.exe
            os_name: windows
            arch_name: aarch64

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Build
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }}
        
      - name: Build (Cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os_name != 'windows'
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/pace package/pace-${{ github.ref_name }}-${{ matrix.os_name }}-${{ matrix.arch_name }}
          cd package
          shasum -a 256 pace-${{ github.ref_name }}-${{ matrix.os_name }}-${{ matrix.arch_name }} > pace-${{ github.ref_name }}-${{ matrix.os_name }}-${{ matrix.arch_name }}.sha256

      - name: Package (Windows)
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/pace.exe package/pace-${{ github.ref_name }}-${{ matrix.os_name }}-${{ matrix.arch_name }}.exe
          cd package
          sha256sum pace-${{ github.ref_name }}-${{ matrix.os_name }}-${{ matrix.arch_name }}.exe > pace-${{ github.ref_name }}-${{ matrix.os_name }}-${{ matrix.arch_name }}.exe.sha256

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.os_name }}-${{ matrix.arch_name }}
          path: pace-${{ github.ref_name }}-*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          merge-multiple: true
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            pace-*
            pace-*.exe
            pace-*.sha256
          generate_release_notes: true
