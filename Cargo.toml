[workspace]
members = [
    "compiler/lexer",
    "compiler/parser",
    "compiler/ast",
    "compiler/resolver",
    "compiler/typechecker",
    "compiler/mir",
    "compiler/lowering",
    "compiler/vm",
    "compiler/cli",
    "compiler/linker",
    "compiler/codegen",
    "compiler/arc"
