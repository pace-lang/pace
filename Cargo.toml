[workspace]
members = ["crates/pace-ast","crates/pace-cli", "crates/pace-codegen-cranelift", "crates/pace-driver", "crates/pace-errors", "crates/pace-parser", "crates/pace-runtime", "crates/pace-ty", "crates/pace-pkg", "crates/pace-lsp", "crates/pace-hir", "crates/pace-mir", "crates/pace-middle", "crates/pace-span", "crates/pace-session"]
default-members = ["crates/pace-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Pace Contributors"]
rust-version = "1.98.0"
license = "MIT"

[workspace.dependencies]
bumpalo = "3.20.3"
clap = { version = "4.6.6", features = ["derive"] }
chumsky = "0.13.0"
ariadne = "0.6.0"
miette = { version = "7.6.0", features = ["fancy"] }
insta = { version = "1.48", features = ["yaml"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
toml_edit = "0.25"
tempfile = "3.10"
tar = "0.4.40"
flate2 = "1.0.28"
pretty = "0.12.3"
walkdir = "2.4.0"
ureq = { version = "3.4", features = ["json"] }
dialoguer = "0.12"
semver = "1.0"
colored = "3.1.1"

# Local workspace crates
pace-ast = { path = "crates/pace-ast" }
pace-parser = { path = "crates/pace-parser" }
pace-errors = { path = "crates/pace-errors" }
pace-driver = { path = "crates/pace-driver" }
pace-ty = { path = "crates/pace-ty" }
pace-codegen-cranelift = { path = "crates/pace-codegen-cranelift" }
pace-pkg = { path = "crates/pace-pkg" }
pace-hir = { path = "crates/pace-hir" }
pace-mir = { path = "crates/pace-mir" }
pace-middle = { path = "crates/pace-middle" }
pace-span = { path = "crates/pace-span" }
pace-session = { path = "crates/pace-session" }
cranelift = "0.135.0"
    cranelift-module = "0.135.0"
cranelift-native = "0.135.0"
cranelift-object = "0.135.0"
object = { version = "0.40", default-features = false }

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
drop_non_drop = "allow"
unnecessary_literal_unwrap = "allow"
collapsible_match = "allow"
redundant_field_names = "allow"
while_let_loop = "allow"
unnecessary_get_then_check = "allow"
needless_range_loop = "allow"
unnecessary_unwrap = "allow"
if_same_then_else = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
